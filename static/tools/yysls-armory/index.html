<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>燕云十六声装备管理器</title>
    <meta
      name="description"
      content="燕云十六声装备管理器，支持角色切换、装备库浏览、部位筛选、流派筛选、名称搜索与数据导入导出。"
    />
    <style>
      :root {
        --bg: #eef2f7;
        --surface: rgba(255, 255, 255, 0.9);
        --surface-2: rgba(247, 250, 252, 0.96);
        --line: rgba(27, 39, 51, 0.1);
        --line-strong: rgba(27, 39, 51, 0.16);
        --ink: #14212d;
        --muted: #667381;
        --accent: #1f6aa5;
        --accent-2: #0e8f79;
        --accent-3: #b26b21;
        --danger: #b54739;
        --shadow: 0 24px 60px rgba(17, 29, 43, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      .hidden {
        display: none !important;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(31, 106, 165, 0.12), transparent 24%),
          radial-gradient(circle at top right, rgba(14, 143, 121, 0.1), transparent 22%),
          linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      }

      button,
      select,
      input,
      textarea,
      a {
        font: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1480px, calc(100% - 28px));
        margin: 0 auto;
        padding: 24px 0 56px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.74);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .manager-header {
        border-radius: 30px;
        padding: 22px 24px;
        display: grid;
        gap: 18px;
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
      }

      .title-wrap {
        display: grid;
        gap: 10px;
      }

      .eyebrow {
        width: fit-content;
        padding: 8px 12px;
        border-radius: 999px;
        color: var(--accent);
        background: rgba(31, 106, 165, 0.12);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      h1,
      h2,
      h3 {
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3.2rem);
        line-height: 1.04;
      }

      .subtle {
        color: var(--muted);
        line-height: 1.7;
      }

      .header-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .account-group {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 18px;
        background: rgba(247, 250, 252, 0.96);
        border: 1px solid var(--line);
      }

      .account-group span {
        color: var(--muted);
        font-size: 0.92rem;
        white-space: nowrap;
      }

      select,
      input[type="text"],
      textarea {
        width: 100%;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 11px 13px;
      }

      .account-group select {
        min-width: 180px;
        background: transparent;
        border: 0;
        padding: 0;
      }

      .button,
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        border-radius: 999px;
        padding: 11px 16px;
        font-weight: 700;
      }

      .button.primary,
      button.primary {
        background: var(--ink);
        color: #fff;
      }

      .button.secondary,
      button.secondary {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line-strong);
      }

      button.danger {
        background: rgba(181, 71, 57, 0.12);
        color: var(--danger);
      }

      .status-banner {
        padding: 14px 16px;
        border-radius: 20px;
        line-height: 1.6;
      }

      .status-banner.info {
        background: rgba(14, 143, 121, 0.1);
        color: var(--accent-2);
      }

      .status-banner.warn {
        background: rgba(181, 71, 57, 0.1);
        color: var(--danger);
      }

      .status-banner.hidden {
        display: none;
      }

      .inventory-shell {
        margin-top: 20px;
        border-radius: 30px;
        padding: 22px;
        display: grid;
        gap: 18px;
      }

      .inventory-shell.hidden {
        display: none;
      }

      .stats-row {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .mini-stat {
        padding: 16px 18px;
        border-radius: 20px;
        background: linear-gradient(155deg, rgba(20, 33, 45, 0.96), rgba(39, 60, 78, 0.92));
        color: #fff;
      }

      .mini-stat small {
        display: block;
        margin-bottom: 8px;
        color: rgba(255, 255, 255, 0.72);
      }

      .mini-stat strong {
        font-size: clamp(1.35rem, 3vw, 2rem);
      }

      .toolbar-row {
        display: grid;
        gap: 14px;
      }

      .toolbar-main {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(0, 1fr) 420px;
        align-items: end;
      }

      .capsule-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .capsule {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(247, 250, 252, 0.96);
        color: var(--muted);
        font-weight: 700;
      }

      .capsule.active {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }

      .filter-row {
        display: grid;
        gap: 14px;
        grid-template-columns: 160px minmax(0, 1fr) auto;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field span {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .toolbar-actions {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
      }

      .section-head p {
        color: var(--muted);
        line-height: 1.6;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-radius: 999px;
        background: rgba(247, 250, 252, 0.96);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.9rem;
      }

      .equipment-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .pagination-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .pagination-summary {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .pagination-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pagination-page {
        color: var(--muted);
        font-size: 0.88rem;
        white-space: nowrap;
      }

      .equipment-card {
        display: grid;
        gap: 10px;
        padding: 14px;
        border-radius: 20px;
        background: var(--surface-2);
        border: 1px solid rgba(20, 33, 45, 0.08);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
      }

      .equipment-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 34px rgba(17, 29, 43, 0.1);
        border-color: rgba(31, 106, 165, 0.2);
      }

      .equipment-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .equipment-card-title {
        display: grid;
        gap: 4px;
      }

      .equipment-card-title strong {
        font-size: 0.96rem;
      }

      .pill-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        white-space: nowrap;
        overflow: hidden;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 6px 8px;
        border-radius: 999px;
        font-size: 0.78rem;
        background: rgba(31, 106, 165, 0.08);
        color: var(--accent);
      }

      .pill.teal {
        background: rgba(14, 143, 121, 0.1);
        color: var(--accent-2);
      }

      .pill.gold {
        background: rgba(178, 107, 33, 0.14);
        color: var(--accent-3);
      }

      .data-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .data-block {
        display: grid;
        gap: 6px;
      }

      .card-stat-editor {
        display: grid;
        gap: 6px;
        grid-template-columns: minmax(0, 1fr) 82px;
        align-items: center;
      }

      .card-stat-editor select,
      .card-stat-editor input[type="number"] {
        width: 100%;
        padding: 7px 9px;
        border-radius: 10px;
        border: 1px solid rgba(20, 33, 45, 0.1);
        background: rgba(255, 255, 255, 0.96);
        font-size: 0.82rem;
      }

      .card-stat-editor input[type="number"] {
        text-align: center;
      }

      .card-stat-line {
        font-size: 0.86rem;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .label {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .substats {
        display: grid;
        gap: 6px;
        grid-template-columns: 1fr;
      }

      .substat-chip {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(20, 33, 45, 0.06);
        font-size: 0.84rem;
        align-items: center;
      }

      .substat-chip-edit {
        display: grid;
        gap: 6px;
        grid-template-columns: minmax(0, 1fr) 82px;
      }

      .substat-chip-edit select,
      .substat-chip-edit input[type="number"] {
        width: 100%;
        padding: 6px 8px;
        border-radius: 10px;
        border: 1px solid rgba(20, 33, 45, 0.08);
        background: rgba(255, 255, 255, 0.98);
        font-size: 0.8rem;
      }

      .substat-chip-edit input[type="number"] {
        text-align: center;
      }

      .substat-chip span,
      .substat-chip strong {
        white-space: nowrap;
      }

      .substat-chip span {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .substat-chip strong {
        font-size: 0.88rem;
        flex-shrink: 0;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .card-actions button {
        padding: 7px 10px;
        font-size: 0.78rem;
        border-radius: 999px;
      }

      .ghost-text {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(17, 27, 38, 0.54);
        backdrop-filter: blur(10px);
        z-index: 50;
      }

      .modal-backdrop.hidden {
        display: none;
      }

      .modal-panel {
        width: min(980px, 100%);
        max-height: min(88vh, 920px);
        overflow: auto;
        border-radius: 28px;
        padding: 22px;
        display: grid;
        gap: 16px;
      }

      .equipment-editor-panel {
        width: min(960px, calc(100% - 24px));
        max-height: min(96vh, 980px);
        overflow: auto;
        padding: 18px;
        gap: 12px;
      }

      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .close-button {
        width: 42px;
        height: 42px;
        padding: 0;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--line-strong);
        color: var(--ink);
        font-size: 1.2rem;
        line-height: 1;
      }

      .modal-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .modal-tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 11px 16px;
        border-radius: 999px;
        background: rgba(247, 250, 252, 0.96);
        border: 1px solid var(--line);
        color: var(--muted);
        font-weight: 700;
      }

      .modal-tab.active {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }

      .modal-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
      }

      .modal-box {
        padding: 18px;
        border-radius: 22px;
        background: rgba(247, 250, 252, 0.96);
        border: 1px solid var(--line);
      }

      .modal-box.hidden {
        display: none;
      }

      .modal-box h3 {
        margin-bottom: 8px;
        font-size: 1rem;
      }

      .dropzone {
        display: grid;
        gap: 10px;
        padding: 18px;
        border-radius: 20px;
        border: 1px dashed var(--line-strong);
        background: rgba(255, 255, 255, 0.86);
      }

      .dropzone input[type="file"] {
        padding: 0;
        background: transparent;
        border: 0;
      }

      .modal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .editor-shell {
        display: grid;
        gap: 10px;
        font-size: 0.92rem;
      }

      .editor-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .editor-slot-row {
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(130px, 0.41fr) minmax(220px, 0.68fr);
      }

      .editor-slot-pair {
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(0, 1fr);
      }

      .editor-slot-pair.has-weapon {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      .editor-stat-card {
        padding: 12px;
        border-radius: 18px;
        background: rgba(247, 250, 252, 0.92);
        border: 1px solid var(--line);
        display: grid;
        gap: 8px;
        align-content: start;
      }

      .editor-stat-card h3,
      .editor-substats h3 {
        font-size: 0.96rem;
      }

      .editor-stat-row {
        display: grid;
        gap: 8px;
        grid-template-columns: minmax(140px, 190px) 108px;
        align-items: end;
        width: fit-content;
        max-width: 100%;
      }

      .editor-toggle-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .editor-status-field {
        display: grid;
        gap: 8px;
        align-content: start;
      }

      .editor-status-field > span {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .editor-check {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(247, 250, 252, 0.96);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.94rem;
      }

      .editor-check input {
        width: auto;
        margin: 0;
        transform: scale(1.1);
      }

      .editor-substats {
        display: grid;
        gap: 8px;
        justify-items: start;
      }

      .substat-editor-row {
        display: grid;
        gap: 8px;
        width: fit-content;
        max-width: 100%;
        grid-template-columns: minmax(320px, 420px) 84px 72px;
        align-items: end;
      }

      .substat-editor-row .field {
        min-width: 0;
      }

      .substat-editor-row select,
      .substat-editor-row .field span,
      .substat-chip span,
      .substat-chip strong {
        white-space: nowrap;
      }

      .substat-editor-row input[name="subValue"] {
        width: 84px;
        min-width: 84px;
        text-align: center;
      }

      .editor-inline-action {
        align-self: stretch;
        min-width: 72px;
        width: 72px;
      }

      .editor-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .editor-field-compact span,
      .editor-shell .field span {
        font-size: 0.84rem;
      }

      .editor-shell input[type="text"],
      .editor-shell input[type="number"],
      .editor-shell select {
        padding: 9px 11px;
        border-radius: 12px;
        font-size: 0.92rem;
      }

      .editor-stat-row input[type="number"],
      .editor-stat-row select {
        width: 100%;
      }

      .editor-class-dropdown {
        position: relative;
      }

      .editor-class-dropdown summary {
        list-style: none;
        padding: 9px 11px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        color: var(--ink);
      }

      .editor-class-dropdown summary::-webkit-details-marker {
        display: none;
      }

      .editor-class-menu {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        z-index: 20;
        max-height: 220px;
        overflow: auto;
        padding: 10px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 18px 42px rgba(17, 29, 43, 0.14);
      }

      .editor-class-option {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 4px;
        color: var(--ink);
        font-size: 0.9rem;
      }

      .editor-class-option input {
        width: auto;
        margin: 0;
      }

      textarea {
        min-height: 220px;
        resize: vertical;
      }

      @media (max-width: 1380px) {
        .equipment-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 1180px) {
        .stats-row,
        .equipment-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 980px) {
        .header-top,
        .filter-row,
        .toolbar-main,
        .modal-grid {
          grid-template-columns: 1fr;
        }

        .header-top {
          display: grid;
        }

        .editor-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .editor-slot-row {
          grid-template-columns: 1fr;
        }

        .editor-stat-row {
          grid-template-columns: minmax(120px, 1fr) 108px;
        }
      }

      @media (max-width: 760px) {
        .page {
          width: min(100% - 18px, 1480px);
          padding-top: 16px;
        }

        .manager-header,
        .inventory-shell,
        .modal-panel {
          padding: 18px;
          border-radius: 24px;
        }

        .stats-row,
        .equipment-grid,
        .data-grid,
        .substats,
        .substat-editor-row,
        .editor-grid {
          grid-template-columns: 1fr;
        }

        .equipment-card-top,
        .editor-footer {
          flex-direction: column;
          align-items: flex-start;
        }

        .card-actions {
          flex-direction: row;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="manager-header panel">
        <div class="header-top">
          <div class="title-wrap">
            <div>
              <h1>燕云十六声装备管理器</h1>
            </div>
          </div>

          <div class="header-controls">
            <div class="account-group">
              <span>当前角色</span>
              <select id="accountSelect"></select>
            </div>
            <button class="secondary" id="createAccountButton" type="button">+ 新建角色</button>
            <button class="danger" id="deleteAccountButton" type="button">删除角色</button>
            <button class="secondary" id="openDataModalButton" type="button">数据工具</button>
            <a class="button secondary" href="/tools/yysls-graduation/">打开毕业率计算器</a>
          </div>
        </div>

        <div id="messageBox" class="status-banner info">
          正在准备装备数据。
        </div>
      </header>

      <section class="inventory-shell panel" id="inventoryShell">
        <div class="toolbar-row">
          <div class="section-head">
            <div>
              <h2>部位筛选</h2>
            </div>
          </div>
          <div class="toolbar-main">
            <div class="capsule-bar" id="slotCapsules"></div>
            <div class="filter-row">
              <label class="field">
                <span>流派筛选</span>
                <select id="classFilter"></select>
              </label>
              <label class="field">
                <span>名称搜索</span>
                <input id="searchInput" type="text" placeholder="按装备备注名筛选" />
              </label>
              <div class="toolbar-actions">
                <button class="secondary" id="resetFiltersButton" type="button">重置筛选</button>
              </div>
            </div>
          </div>
        </div>

        <div class="section-head">
          <div>
            <h2>装备库</h2>
          </div>
        </div>

        <main id="equipmentGrid" class="equipment-grid"></main>
        <div id="paginationBar" class="pagination-bar"></div>
      </section>
    </main>

    <section class="modal-backdrop hidden" id="dataModal">
      <div class="modal-panel panel">
        <div class="modal-head">
          <div>
            <h2>数据工具</h2>
            <p class="subtle">导入、导出、切换或清空当前浏览器中的装备数据。</p>
          </div>
          <button class="close-button" id="closeDataModalButton" type="button" aria-label="关闭弹层">×</button>
        </div>

        <div class="modal-tabs">
          <button class="modal-tab active" id="importTabButton" type="button">导入数据</button>
          <button class="modal-tab" id="accountTabButton" type="button">角色与缓存</button>
        </div>

        <div class="modal-grid">
          <section class="modal-box" id="importBox">
            <h3>导入 / 导出</h3>
            <p class="subtle">支持上传 `.json/.txt`，也支持直接粘贴从浏览器 `localStorage` 导出的明文 JSON。</p>
            <div class="fields" style="margin-top: 14px;">
              <label class="field">
                <span>选择文件</span>
                <div class="dropzone">
                  <input id="fileInput" type="file" accept=".json,.txt,application/json,text/plain" />
                </div>
              </label>
              <label class="field">
                <span>JSON 内容</span>
                <textarea id="jsonInput" placeholder='把形如 {"game_account_list":["云川渡"]...} 的明文 JSON 粘贴到这里'></textarea>
              </label>
            </div>
            <div class="modal-actions">
              <button class="primary" id="importButton" type="button">导入到管理器</button>
              <button class="secondary" id="exportButton" type="button">导出当前数据</button>
              <button class="secondary" id="downloadButton" type="button">下载为文件</button>
            </div>
            <div id="importStatus" class="status-banner info hidden" style="margin-top: 14px;"></div>
          </section>

          <section class="modal-box hidden" id="accountBox">
            <h3>角色与缓存</h3>
            <p class="subtle">这里处理当前浏览器中的本地缓存。当前管理器不会再自动载入站内预置数据。</p>
            <div class="modal-actions">
              <button class="secondary" id="loadSavedButton" type="button">读取浏览器缓存</button>
              <button class="danger" id="clearSavedButton" type="button">清空浏览器缓存</button>
            </div>
            <p class="subtle" style="margin-top: 16px;">
              当前角色切换在主页面右上角完成；如果需要新增空角色，可以直接点击主页面的 `+ 新建角色`。
            </p>
          </section>
        </div>
      </div>
    </section>

    <section class="modal-backdrop hidden" id="equipmentEditorModal">
      <div class="modal-panel panel equipment-editor-panel">
        <div class="modal-head">
          <div>
            <h2 id="equipmentEditorTitle">编辑装备</h2>
          </div>
          <button class="close-button" id="closeEquipmentEditorButton" type="button" aria-label="关闭装备编辑">×</button>
        </div>
        <div id="equipmentEditorForm" class="editor-shell"></div>
      </div>
    </section>

    <script src="/tools/yysls-armory/app.js?v=20260516-12"></script>
  </body>
</html>
