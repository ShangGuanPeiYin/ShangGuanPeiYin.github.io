# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://example.com/"
defaultContentLanguage = "zh-cn"
disableLanguages = []

[languages]
  [languages.zh-cn]
    languageName = "简体中文"
    languageCode = "zh-cn"
    weight = 9
    title = "我的博客"

    [languages.zh-cn.params]
      displayName = "简体中文"
      isoCode = "zh-cn"
      rtl = false
      dateFormat = "2006-01-02"
      logo = "img/sabito.png"
      description = "使用 Hugo 和 Blowfish 搭建的个人博客。"

    [languages.zh-cn.params.author]
      name = "你的名字"
      image = "img/sabito.png"
      headline = "记录技术、写作与生活。"
      bio = "欢迎来到我的个人博客，这里会分享文章、笔记和项目。"
      links = [
        { github = "https://github.com/yourname" },
      ]

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 30
hasCJKLanguage = true

buildDrafts = false
buildFuture = false

enableEmoji = true

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'always'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
